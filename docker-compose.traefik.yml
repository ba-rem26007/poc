version: '3.8'

services:
  # Symfony 7 Backend (API Platform & EasyAdmin)
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: tls_3tier_backend
    volumes:
      - ./backend:/var/www/backend
    environment:
      APP_ENV: prod
      APP_SECRET: c06a092ff33719b4ba1ca7569b4cb0fa
      DATABASE_URL: postgresql://symfony:symfony_pass@db:5432/app_db?serverVersion=16&charset=utf8
      CORS_ALLOW_ORIGIN: '*'
    depends_on:
      - db
    networks:
      - default
      - traefik_net
    labels:
      - "traefik.enable=true"
      # Route EasyAdmin dashboard & Protected Docs
      - "traefik.http.routers.backend-admin.rule=Host(`poc.d1dev.fr`) && (PathPrefix(`/admin`) || PathPrefix(`/doc`) || PathPrefix(`/login`) || PathPrefix(`/logout`))"
      - "traefik.http.routers.backend-admin.entrypoints=websecure"
      - "traefik.http.routers.backend-admin.tls.certresolver=myresolver"
      - "traefik.http.routers.backend-admin.service=backend-svc"
      # Route API Platform endpoints
      - "traefik.http.routers.backend-api.rule=Host(`poc.d1dev.fr`) && PathPrefix(`/api`)"
      - "traefik.http.routers.backend-api.entrypoints=websecure"
      - "traefik.http.routers.backend-api.tls.certresolver=myresolver"
      - "traefik.http.routers.backend-api.service=backend-svc"
      - "traefik.http.services.backend-svc.loadbalancer.server.port=8000"

  # React Frontend (Vite)
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: tls_3tier_frontend
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
    environment:
      VITE_API_URL: https://poc.d1dev.fr/api
    networks:
      - default
      - traefik_net
    labels:
      - "traefik.enable=true"
      # Route Frontend (root fallback)
      - "traefik.http.routers.frontend.rule=Host(`poc.d1dev.fr`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=myresolver"
      - "traefik.http.routers.frontend.service=frontend-svc"
      - "traefik.http.services.frontend-svc.loadbalancer.server.port=5173"

  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: tls_3tier_db
    environment:
      POSTGRES_DB: app_db
      POSTGRES_USER: symfony
      POSTGRES_PASSWORD: symfony_pass
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - default

networks:
  traefik_net:
    external: true
    name: traefik_net # Modify if your server network is named 'web' or 'traefik'

volumes:
  db_data:
